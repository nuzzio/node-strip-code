# .travis.yml for node-strip-code
language: node_js
node_js:
  - "18" # Current LTS
  - "20" # Active LTS
  - "22" # Latest stable (or future LTS)
# Older versions if still supporting them, e.g.:
# - "16"
# - "14"

cache:
  directories:
    - node_modules

install:
  - npm install

script:
  - npm test
  # If you add linting:
  # - npm run lint

# Optional: configure notifications, coverage reporting, etc.
after_success:
  - npm run coverage # if you set up a coverage script
  - npm run coveralls # if using coveralls.io

jobs:
  include:
    - stage: release
      node_js: "20" # Or your preferred release Node version
      if: branch = main AND type = push AND tag IS present
      script:
        - echo "Skipping tests for release tag"
      deploy:
        provider: npm
        email: "$NPM_EMAIL" # Set in Travis CI settings
        api_key: "$NPM_TOKEN"  # Set in Travis CI settings as a secure variable
        skip_cleanup: true
        on:
          tags: true
          repo: "nuzzio/node-strip-code" # Make sure this matches your repo
